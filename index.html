<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MangoSource · 投资资源地图</title>
<style>
:root{
  --paper:#fcfbf8; --ink:#1b1a17; --soft:#3f3d38; --muted:#77756c; --faint:#a8a69c;
  --line:#e8e6df; --line2:#d6d3c9; --accent:#c2571a; --accent-soft:#fbeee4;
  --ok:#2f6b4f; --okbg:#eaf3ee; --warn:#8a6a2f; --warnbg:#f7f0e2;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:40px 28px 90px;display:grid;grid-template-columns:214px 1fr;gap:56px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;gap:26px;padding:24px 16px 60px}}
.side{position:sticky;top:40px;align-self:start;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.author{display:block;text-align:center;font-size:12px;color:var(--muted);text-decoration:none;margin-top:-14px}
.author:hover{color:var(--accent)}
.dot{width:22px;height:22px;border-radius:50%;background:var(--accent);flex:none;position:relative}
.dot:after{content:"";position:absolute;left:6px;top:3px;width:2px;height:9px;background:#fff;border-radius:2px;transform:rotate(18deg)}
.intro{font-size:13px;line-height:1.75;color:var(--soft)}
.intro em{font-style:normal;color:var(--faint);display:block;margin-top:8px;font-size:12px;line-height:1.7}
.ident p{margin:0;font-size:13.5px;line-height:1.8;color:var(--soft)}
.ident .ev{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{text-align:left;padding:7px 10px;margin-left:-10px;border-radius:7px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:#00000006;color:var(--ink)}
.nav button[aria-current="true"]{background:#00000008;color:var(--ink);font-weight:600}
.nav .soon{text-align:left;padding:7px 10px;margin-left:-10px;font-size:13.5px;color:var(--faint);cursor:default;display:flex;justify-content:space-between;align-items:center}
.nav .soon:after{content:'敬请期待';font-size:10.5px;color:var(--faint);opacity:.7}
.nav .soon:hover{color:var(--faint)}
.nav em{font-style:normal;font-size:11px;color:var(--faint)}
.legend{border-top:1px solid var(--line);padding-top:13px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;line-height:1.6}
.legend b{color:var(--soft);font-weight:500}
.join{display:block;text-align:center;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:8px 10px;background:var(--accent-soft)}
.main{min-width:0}
h1{margin:0;font-family:var(--serif);font-size:34px;line-height:1.35;font-weight:600;letter-spacing:.01em}
.sub{margin:9px 0 0;font-size:14px;line-height:1.85;color:var(--soft);max-width:700px}
.tabs{display:flex;flex-wrap:wrap;gap:18px;margin:22px 0 24px;border-bottom:1px solid var(--line)}
.tabs button{font-size:13px;color:var(--muted);padding:0 0 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:22px 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:22px 18px}
.gcard{display:flex;flex-direction:column;gap:8px;padding:17px 16px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:.18s;min-height:118px}
.gcard:hover{border-color:var(--line2);box-shadow:0 10px 28px -18px #00000045;transform:translateY(-2px)}
.gcard .gt{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:.01em}
.gcard .gd{font-size:12.5px;line-height:1.7;color:var(--muted)}
.gcard .gw{font-size:11.5px;color:var(--faint);line-height:1.6}
.gcard .gm{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--faint);align-items:center}
.gcard .gm b{font-weight:500;color:var(--muted)}
.xref{display:inline-flex;gap:4px;align-items:center;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.card{text-align:left;display:flex;flex-direction:column;gap:9px;padding:18px 16px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:.18s;min-height:148px}
.card:hover{border-color:var(--line2);box-shadow:0 10px 28px -18px #00000045;transform:translateY(-2px)}
.card .say{font-family:var(--serif);font-size:16px;line-height:1.6}
.card .sv{font-size:12.5px;color:var(--muted);line-height:1.7}
.card .who{margin-top:auto;font-size:11.5px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;padding:1.5px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:186px 1fr 112px;gap:20px;align-items:baseline;padding:16px 12px;margin:0 -12px;border-bottom:1px solid var(--line);border-radius:8px;text-align:left}
.row:hover{background:#00000004}
.row .n{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;line-height:1.45}
.row .d{font-size:13px;color:var(--soft);letter-spacing:.005em;line-height:1.65}
.row .d i{font-style:normal;color:var(--muted);font-size:12px;display:block;margin-top:3px}
.row .m{font-size:11px;color:var(--faint);text-align:right;line-height:1.7}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-local{background:#f1efea;color:var(--muted)}
.grp{margin:34px 0 12px;font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:600}
.grp:first-child{margin-top:24px}
.note{border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.8;margin:8px 0 10px}
.note b{color:var(--soft);font-weight:600}
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow:auto;background:#1b1a1780;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.panel{width:100%;max-width:660px;background:var(--paper);border-radius:14px;padding:26px 30px;box-shadow:0 30px 80px -30px #00000080}
.panel .x{float:right;color:var(--muted);font-size:16px}
.panel h2{margin:4px 0 0;font-family:var(--serif);font-size:24px;line-height:1.5;font-weight:600;max-width:560px}
.panel .v{margin:16px 0 0;font-family:var(--serif);font-size:17px;line-height:1.7;border-left:2px solid var(--accent);padding-left:14px}
.panel .sec{margin-top:20px}
.panel .sec h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.13em;color:var(--faint);font-weight:600}
.kv{font-size:13px;color:var(--soft);line-height:1.9}
.uses{display:flex;flex-direction:column;gap:9px}
.uses a{font-size:13px;color:var(--accent)}
.uses a span{color:var(--faint);font-size:12px;margin-left:8px}
.copybtn{display:inline-block;font-size:12px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;margin-bottom:8px}
.prompt{background:#f4f2ec;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--soft);white-space:pre-wrap;margin-top:6px}
.dstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 26px}
@media(max-width:760px){.dstrip{grid-template-columns:1fr}}
.dentry{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;transition:.15s}
.dentry:hover{border-color:var(--accent);box-shadow:0 8px 24px -16px #00000045;transform:translateY(-1px)}
.de-n{font-size:15px;font-weight:600}
.de-d{font-size:12.5px;color:var(--soft);line-height:1.7}
.de-w{font-size:11.5px;color:var(--faint);margin-top:auto}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.pchip{font-size:12.5px;padding:6px 13px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);background:#fff}
.pchip:hover{border-color:var(--accent);color:var(--accent)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.plead{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-left:2px solid var(--accent);background:#fff;border-radius:0 8px 8px 0;margin-bottom:22px}
.pl-who{font-size:13.5px;color:var(--soft)}
.pl-need{font-size:12px;color:var(--muted);line-height:1.9}
.pl-need b{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:3px;font-size:10px;margin:0 4px 0 0;font-weight:600}
.wordwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:5px;padding:14px 13px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:92px;transition:.18s}
.wcard:hover{border-color:var(--line2);box-shadow:0 10px 24px -18px #00000045;transform:translateY(-2px)}
.w-t{font-size:13.5px;font-weight:600}
.w-d{font-size:11.5px;color:var(--muted);line-height:1.6}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.8}
/* 左栏：照 topinspo.design */
.wrap{grid-template-columns:220px minmax(0,1fr);gap:56px}
.side{width:220px;gap:32px;padding:0;position:sticky;top:40px;height:calc(100vh - 80px);display:flex;flex-direction:column;align-self:start;overflow-y:auto;scrollbar-width:none}
.s-identity{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.s-logo{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.s-logo:hover{opacity:.7}
.s-mark{width:20px;height:20px;border-radius:5px;background:var(--accent);color:#fcfcf8;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.s-word{font-size:15px;font-weight:600;letter-spacing:.01em}
.s-about p{margin:0;font-size:14px;line-height:1.65;letter-spacing:.01em;color:var(--ink-soft)}
.s-about p a{white-space:nowrap;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.s-about p a:hover{text-decoration-color:currentColor}
.s-entries{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.s-entries a{display:flex;align-items:baseline;gap:6px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.s-name{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.s-entries a:hover .s-name{text-decoration-color:currentColor}
.s-stat{color:var(--faint);font-size:14px}
.side .nav{display:flex;flex-direction:column;gap:2px;flex:1 0 auto;justify-content:center;margin:0}
.side .nav button{width:100%;min-height:38px;margin:0;padding:7px 4px;text-align:left;font-size:14px;letter-spacing:.01em;color:var(--muted);background:none;border:0;border-radius:8px;transition:color .15s,background-color .15s}
.side .nav button:hover{color:var(--ink);background:#00000008}
.side .nav button[aria-current="true"]{color:var(--ink);font-weight:600}
.side .nav .soon{margin:0;padding:7px 4px;min-height:38px;display:flex;align-items:center;font-size:14px;color:var(--faint);cursor:default}
.s-meta{margin-top:auto}
.s-promo{border:.5px solid var(--line);border-radius:12px;background:#fff;padding:20px 20px 18px}
.s-promo-name{font-size:14px;font-weight:600}
.s-promo-desc{margin-top:6px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.s-promo-cta{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--accent)}
/* 头部 / tabs / 导航 / 底部卡：照 topinspo 实测值 */
.main h1,.feed-head h1{margin:0;font-size:20px;line-height:26px;font-weight:500;letter-spacing:-.01em;color:#1e1e1e;font-family:var(--sans)}
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:36px}
.head-actions{display:inline-flex;gap:8px;align-items:center;flex:none}
.hbtn{border:.5px solid var(--line2);border-radius:999px;min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 15px;font-size:14px;letter-spacing:.01em;color:var(--ink);transition:background-color .15s}
.hbtn:hover{background:#00000008}
.hpill{border:.5px solid var(--line2);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:12px;color:var(--ink);flex:none}
.hpill:hover{background:#00000008}
#sub{display:none}
.tabs{margin-top:20px;border-bottom:1px solid var(--line);gap:24px;padding-bottom:0}
.tabs button{font-size:14px;letter-spacing:.01em;color:var(--ink-soft);padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink);border-bottom-color:var(--line2)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.side .nav button{font-size:14px;font-weight:400;color:var(--muted)}
.side .nav button[aria-current="true"]{background:#00000008;color:var(--ink);font-weight:500}
.side .nav .soon{position:relative;cursor:not-allowed;color:var(--faint);font-size:14px}
.side .nav .soon:after{content:attr(data-tip);position:absolute;left:100%;top:50%;transform:translate(8px,-50%);background:var(--ink);color:#fcfcf8;font-size:12px;line-height:1;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.side .nav .soon:hover:after,.side .nav .soon.show-tip:after{opacity:1}
.s-promo{position:relative}
.s-promo-cta{display:block;margin:16px auto 0;height:32px;line-height:32px;text-align:center;background:var(--ink);color:#fcfcf8;border-radius:999px;font-size:14px;max-width:176px}
.s-promo-cta:hover{opacity:.9}
.foot{display:none}
/* Skill 卡片：照 topinspo /skills */
.skgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px}
@media(max-width:1180px){.skgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.skgrid{grid-template-columns:1fr}}
.skcard{display:flex;flex-direction:column;gap:7px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:.18s;min-height:132px;text-align:left}
.skcard:hover{border-color:var(--line2);box-shadow:0 10px 28px -18px #00000045;transform:translateY(-2px)}
.sk-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);letter-spacing:.04em}
.sk-arr{color:var(--faint)}
.sk-name{font-size:13.5px;font-weight:600;line-height:1.45}
.sk-blurb{font-size:12.5px;line-height:1.65;color:var(--muted)}
.sk-foot{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint)}
.sk-av{width:16px;height:16px;border-radius:50%;background:var(--line)}
/* 大师卡片 */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1180px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mcard{display:flex;flex-direction:column;gap:8px;padding:16px 16px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:.18s;min-height:132px}
.mcard:hover{border-color:var(--line2);box-shadow:0 10px 26px -18px #00000045;transform:translateY(-2px)}
.mc-school{font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.mc-name{font-size:15px;font-weight:600}
.mc-line{font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--soft)}
.mc-foot{margin-top:auto;display:flex;gap:6px}
.mc-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.mc-none{font-size:10.5px;color:var(--faint)}
.mlinks{display:flex;flex-direction:column;gap:8px}
.mlink{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none}
.mlink:hover{border-color:var(--accent)}
.ml-k{font-size:10.5px;color:var(--faint);flex:none;width:56px}
.ml-t{font-size:13px;color:var(--ink);flex:1}
.ml-a{color:var(--accent);font-size:12px}
.mc-rec{font-size:11.5px;line-height:1.6;color:var(--faint)}
.mpoints{display:flex;flex-direction:column;gap:9px}
.mpoint{font-size:13px;line-height:1.75;color:var(--soft);padding-left:24px;position:relative}
.mpoint b{position:absolute;left:0;top:2px;width:16px;height:16px;line-height:16px;text-align:center;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fcfcf8;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(8px);background:#1b1a17;color:#fcfcf8;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ssteps{display:flex;flex-direction:column;gap:14px}
.sstep{display:flex;gap:12px}
.sn{flex:none;width:22px;font-size:11px;color:var(--faint);padding-top:2px}
.sb{flex:1;min-width:0}
.sl{font-size:12.5px;font-weight:600;margin-bottom:4px}
.sd{font-size:13px;color:var(--soft);line-height:1.7}
.su{font-size:11.5px;color:var(--accent);margin-top:3px}
.sp{margin-top:6px;background:#f4f2ec;border-radius:8px;padding:10px 12px}
.ptext{margin:6px 0 0;font-size:12px;line-height:1.75;color:var(--soft);white-space:pre-wrap;font-family:var(--sans)}
.s-about p .go{display:inline-block;margin-left:6px;font-size:12.5px;color:#c2571a;text-decoration:none;vertical-align:1px}
.s-about p .go:hover{opacity:.7}
/* 移动端：顶部栏 + 抽屉式导航 */
.mhead{display:none}
.mscrim{display:none}
@media(max-width:900px){
  .mhead{display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;height:56px;padding:0 16px;background:rgba(252,251,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:80}
  .mh-brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
  .mh-brand .s-mark{width:20px;height:20px;font-size:11px}
  .mh-btn{width:36px;height:36px;border:1px solid var(--line2);border-radius:999px;display:grid;place-items:center;font-size:15px;color:var(--ink);background:#fff}
  .mscrim{display:block;position:fixed;inset:0;background:#1b1a1766;opacity:0;pointer-events:none;transition:opacity .2s;z-index:85}
  .mscrim.on{opacity:1;pointer-events:auto}
  .wrap{grid-template-columns:1fr;gap:0;padding:76px 16px 64px}
  .side{position:fixed;top:0;left:0;width:82%;max-width:320px;height:100dvh;padding:24px 20px;background:var(--paper);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:90;overflow-y:auto;gap:24px}
  .side.open{transform:none}
  .side .nav{justify-content:flex-start}

// 一鱼多吃：同一个对象在几个场景里被用到（反向索引）
function xref(name){
  const out=[];
  Object.entries(SCENE_REL).forEach(([scene,R])=>{
    const all=[...(R.tool||[]),...(R.word||[]),...(R.skill||[]),...(R.master||[])];
    if(all.includes(name)) out.push(scene);
    if((R.prompt||[]).some(i=>PROMPTS[i] && PROMPTS[i][0].includes(name))) out.push(scene);
  });
  return out;
}

function copyText(text,btn,label){
  function fb(t,cb){
    var ta=document.createElement("textarea"); ta.value=t;
    ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    ta.remove(); cb();
  }
  function done(){ if(btn){ var old=label||btn.textContent; btn.textContent="已复制 ✓"; setTimeout(function(){btn.textContent=old;},1600);} }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fb(text,done); });
    } else { fb(text,done); }
  }catch(e){ fb(text,done); }
}

    (window.dataLayer = window.dataLayer || []).push(payload);
    if (TRACK_ENDPOINT && navigator.sendBeacon) {
      navigator.sendBeacon(TRACK_ENDPOINT, JSON.stringify(payload));

    if (location.search.indexOf("debug=1") > -1) console.log("[track]", payload);

  document.getElementById("mlogo").addEventListener("click", function(e){ e.preventDefault(); view="scene"; paint(); close(); });
})();
// 收藏本站（本地记住，回来时高亮）
(function(){
  var KEY="mangosource_saved";
  var btn=document.getElementById("actFav");
  if(!btn) return;
  function sync(){
    var on=false;
    try{ on=localStorage.getItem(KEY)==="1"; }catch(e){}
    btn.textContent=on?"★ 已收藏":"☆ 收藏本站";
    btn.classList.toggle("on",on);
  }
  btn.addEventListener("click",function(){
    var on=false;
    try{ on=localStorage.getItem(KEY)==="1"; }catch(e){}
    try{ localStorage.setItem(KEY, on?"0":"1"); }catch(e){}
    trackEvent("bookmark_toggle",{sub:on?"off":"on"});
    sync();
    if(!on){
      var t=document.getElementById("toast");
      if(t){ t.textContent="已收藏 · 也可以按 Ctrl/⌘+D 存到浏览器书签"; t.classList.add("on"); clearTimeout(window.__t2); window.__t2=setTimeout(function(){t.classList.remove("on");},2200); }
    }
  });
  sync();
})();
// 侧栏底卡轮播：自动播 + 可滑动 + 原点切换
(function(){
  var root=document.getElementById("promo");
  if(!root) return;
  var track=document.getElementById("promoTrack");
  var dotsBox=document.getElementById("promoDots");
  var n=track.children.length, i=0, timer=null;

  for(var k=0;k<n;k++){
    var d=document.createElement("button");
    d.className="s-dot"+(k===0?" on":"");
    d.setAttribute("aria-label","第"+(k+1)+"张");
    (function(idx){ d.addEventListener("click",function(){ go(idx); rest(); }); })(k);
    dotsBox.appendChild(d);
  }
  function go(idx){
    i=(idx+n)%n;
    track.style.transform="translateX(-"+(i*100)+"%)";
    [].forEach.call(dotsBox.children,function(el,ix){ el.classList.toggle("on",ix===i); });
  }
  function play(){ timer=setInterval(function(){ go(i+1); },5200); }
  function rest(){ clearInterval(timer); play(); }
  play();
  root.addEventListener("mouseenter",function(){ clearInterval(timer); });
  root.addEventListener("mouseleave",play);

  var x0=null;
  root.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; clearInterval(timer); },{passive:true});
  root.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>34){ go(dx<0?i+1:i-1); }
    x0=null; play();
  },{passive:true});
})();
